<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queima-queima e ganhe!</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#455d74,#172331 62%);font-family:Arial;color:#16212e}main{width:min(860px,100%);text-align:center}h1{margin:6px;color:#fff7de;font:clamp(2rem,7vw,4rem)/1 Georgia;text-shadow:3px 4px #a33525}.intro{color:#dce8ed}.game{padding:28px;background:#fff6d9;border:5px solid #c89143;border-radius:24px;box-shadow:0 18px #0d1720}.hud{display:flex;justify-content:space-between;text-align:left;margin-bottom:18px}.hud small{display:block;font-weight:bold;color:#6a5845}#score{font-size:2.3rem;font-weight:bold;color:#d83a2e}#board{height:180px;position:relative;overflow:hidden;border:10px solid #784d2f;border-radius:16px;background:repeating-linear-gradient(90deg,#d7a968 0 35px,#d0a05e 36px 70px)}.slot{position:absolute;top:0;bottom:0;width:16.667%;display:flex;justify-content:center;padding-top:12px;border-left:2px dashed #79503588;font-size:.75rem;font-weight:bold}.s10{background:#90c9d144}.s20{background:#aad78044}.s40{background:#ffd25155}.s60{background:#ffc55c66}.s80{background:#9fd56b66}.s100{color:#fff;background:repeating-linear-gradient(135deg,#d83229 0 10px,#f06a2c 10px 20px)}.lane{position:absolute;top:50%;left:0;right:0;height:4px;background:#855331}.finish{position:absolute;z-index:3;top:0;right:0;bottom:0;width:7px;background:#fff4c8;box-shadow:0 0 12px #fff4c8}#puck{position:absolute;z-index:4;top:50%;left:4%;width:52px;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid #6f211d;border-radius:50%;background:radial-gradient(circle at 35% 27%,#fff6d3 0 8%,#f45d3d 10% 38%,#a52d29 70%)}#puck:after{content:'QQ';position:absolute;inset:0;display:grid;place-items:center;color:#ffe5a1;font-weight:bold}.legend{margin:12px;font-size:.8rem;font-weight:bold}.control{display:grid;gap:10px;justify-items:center}#power{width:min(430px,100%);height:15px;border:2px solid #243746;border-radius:99px;overflow:hidden;background:#d9caa5}#fill{height:100%;width:0;background:linear-gradient(90deg,#6dbe65,#ffca3a,#e64a30)}button{cursor:pointer}#flick{min-width:230px;padding:14px 25px;border:0;border-radius:12px;background:linear-gradient(#ff934b,#e6502a);box-shadow:0 5px #9d2c24;color:#fff7de;font-weight:bold;touch-action:none}#status{min-height:1.4em;font-weight:bold;color:#553a28}#reset{border:0;background:none;color:#6c5140;text-decoration:underline}#precision{min-height:42px;margin:12px 0;padding:10px;border:2px dashed #c89143;border-radius:10px;color:#553a28;font-weight:bold}.precision-hot{background:#ffe0a6;animation:pulse .55s 2}.precision-burn{background:#ffd0c5;color:#9f261e;border-color:#d83a2e;animation:pulse .4s 3}@keyframes pulse{50%{transform:scale(1.03)}}#soundToggle{margin:0 0 12px;border:1px solid #c89143;border-radius:8px;padding:6px 10px;background:#fff6d9;color:#553a28;font-weight:bold}#floorControls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}#boostWrap{display:none;color:#553a28;font-weight:bold}.floor-glass{background:linear-gradient(135deg,#c3ecff,#639fc6)!important}.floor-rubber{background:repeating-linear-gradient(45deg,#3f4952 0 8px,#283139 8px 16px)!important}.floor-rubber .slot{color:#fff;text-shadow:1px 1px #000}#playerSetup{display:none;margin:10px 0;padding:10px;border:1px dashed #c89143;border-radius:10px}#playerInputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}#playerInputs input{width:100%;padding:7px;border:1px solid #c89143;border-radius:6px}</style></head><body><main><h1>Queima-queima e ganhe! 🔥</h1><p class="intro">A faixa de 100 pontos muda de lugar. Bata no fim do tabuleiro e marque no retorno.</p><section class="game"><button id="soundToggle" aria-pressed="true">🔊 Som: ligado</button><div id="floorControls"><label>Dificuldade: <select id="difficulty"><option value="easy">Fácil — madeira</option><option value="medium">Médio — 2 pisos</option><option value="hard">Difícil — 3 pisos</option><option value="custom">Livre — escolha o piso</option></select></label><label>Piso: <select id="floor"><option value="wood">Madeira clássica</option><option value="glass">Vidro — alta sensibilidade</option><option value="rubber">Borracha — use impulso extra</option></select></label><label id="boostWrap">Impulso extra <input id="boost" type="range" min="0" max="100" value="0"></label></div><div id="playerSetup"><label>Jogadores: <select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><div id="playerInputs"></div></div><p><label>Modo: <select id="mode"><option value="match">Partida — 5 rodadas</option><option value="training">Treino livre</option><option value="duel">Duelo local</option></select></label></p><div class="hud"><div><small>PONTUAÇÃO</small><span id="score">0</span><small>RECORDE <b id="best">0</b></small></div><div><small>RODADA</small><span id="turn">1 de 5</span><small id="playerLabel"></small></div></div><div id="board"><div class="lane"></div><div id="slots"></div><div class="finish"></div><div id="puck"></div></div><p class="legend">O fim iluminado é a única parede. As faixas só definem a pontuação.</p><div class="control"><div id="power"><div id="fill"></div></div><button id="flick">SEGURE PARA CARREGAR</button></div><p id="challenge"></p><div id="precision">A precisão do retorno aparecerá aqui.</div><p id="status">Observe onde está o 100 e dê o peteleco.</p><button id="reset">Recomeçar partida</button></section></main><script>
const $=s=>document.querySelector(s),slots=$('#slots'),puck=$('#puck'),flick=$('#flick'),fill=$('#fill'),status=$('#status'),soundToggle=$('#soundToggle'),precision=$('#precision'),mode=$('#mode'),challenge=$('#challenge'),board=$('#board'),floor=$('#floor'),boost=$('#boost'),boostWrap=$('#boostWrap'),difficulty=$('#difficulty'),playerSetup=$('#playerSetup'),playerCountEl=$('#playerCount'),playerInputs=$('#playerInputs'),playerLabel=$('#playerLabel');let floorPool=['wood'],hardIndex=0;let audioCtx,soundOn=true;function tone(freq,duration,type='sine',volume=.08,delay=0){if(!soundOn)return;audioCtx??=new AudioContext();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+duration);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+duration)}function sound(kind){if(kind==='charge')tone(180,.05,'square',.035);if(kind==='hit')tone(125,.12,'triangle',.12);if(kind==='score')tone(440,.1,'sine',.08),tone(660,.16,'sine',.07,.08);if(kind==='burn')tone(523,.12,'square',.08),tone(784,.22,'square',.07,.12);if(kind==='miss')tone(130,.25,'sawtooth',.06)}let score=0,round=1,streak=0,player=1,playerCount=2,playerScores=[0,0],playerNames=['Jogador 1','Jogador 2'],target=0,best=Number(localStorage.getItem('qqeBest')||0),x=.04,v=0,launch=0,hitEnd=false,charge=0,charging=false,timer,frame,values=[];function renderPlayers(){playerInputs.innerHTML=Array.from({length:Number(playerCountEl.value)},(_,i)=>`<input data-player="${i}" value="${playerNames[i]||`Jogador ${i+1}`}" placeholder="Jogador ${i+1}">`).join('')}function readPlayers(){playerCount=Number(playerCountEl.value);playerNames=[...playerInputs.querySelectorAll('input')].map((el,i)=>el.value.trim()||`Jogador ${i+1}`);playerScores=Array(playerCount).fill(0)}function chooseFloor(){if(difficulty.value==='easy')floor.value='wood';if(difficulty.value==='medium')floor.value=floorPool[Math.floor(Math.random()*floorPool.length)];if(difficulty.value==='hard'){floor.value=['wood','glass','rubber'][hardIndex++%3]} }function setup(){playerSetup.style.display=mode.value==='duel'?'block':'none';playerLabel.textContent=mode.value==='duel'?playerNames[player-1]||'Jogador 1':'';chooseFloor();board.className=`floor-${floor.value}`;boostWrap.style.display=floor.value==='rubber'?'inline':'none';$('#best').textContent=best;target=[20,40,60,80,100][Math.floor(Math.random()*5)];challenge.textContent=`DESAFIO: pare na faixa ${target} para ganhar +25 bônus`;values=[10,20,40,60,80,100].sort(()=>Math.random()-.5);slots.innerHTML=values.map((n,i)=>`<div class="slot s${n}" style="left:${i*16.667}%">${n===100?'QUEIMA!<br>100':n+' PTS'}</div>`).join('');x=.04;v=0;hitEnd=false;draw()}function draw(){puck.style.left=x*100+'%'}function down(e){if(v||(round>5&&mode.value!=='training'))return;e.preventDefault();charging=true;charge=0;timer=setInterval(()=>{charge=Math.min(100,charge+2);fill.style.width=charge+'%'},25);flick.textContent='CARREGANDO...';sound('charge')}function up(){if(!charging)return;charging=false;clearInterval(timer);if(charge<8){flick.textContent='SEGURE PARA CARREGAR';return}let profile={wood:{gain:1,friction:.994},glass:{gain:1.18,friction:.997},rubber:{gain:.45,friction:.992}}[floor.value];launch=(.004+charge*.000115)*profile.gain+(floor.value==='rubber'?Number(boost.value)*.0001:0);v=launch;fill.style.width='0%';flick.disabled=true;flick.textContent='EM MOVIMENTO...';status.textContent='A força escolhida também define o rebote…';frame=requestAnimationFrame(move)}function move(){x+=v;v*={wood:.994,glass:.997,rubber:.992}[floor.value];if(x>=.97){x=.97;v*=-.86;hitEnd=true;sound('hit')}if(x<=.04){x=.04;v=0}draw();if(Math.abs(v)<.00035){v=0;finish()}else frame=requestAnimationFrame(move)}function finish(){let pts=0;if(hitEnd)pts=values[Math.min(5,Math.floor(x*6))];if(pts===100){streak++;pts*=streak}else streak=0;if(pts===target)pts+=25;score+=pts;sound(!hitEnd?'miss':pts>=100?'burn':'score');let zone=Math.min(5,Math.floor(x*6));precision.className=pts===100?'precision-burn':pts===target?'precision-hot':'';precision.textContent=hitEnd?`RETORNO: faixa ${zone+1} — ${pts} pontos${pts===target?' · DESAFIO CUMPRIDO!':''}`:'RETORNO INVÁLIDO: não tocou a parede final.';if(mode.value==='duel')playerScores[player-1]+=pts;if(score>best){best=score;localStorage.setItem('qqeBest',best)}$('#score').textContent=score;let msg=hitEnd?`Parou em ${pts} pontos no retorno${streak>1?` — COMBO x${streak}!`:''}: +${pts}!`:'Não chegou à parede final: tentativa nula.';if(mode.value==='training'){round++;$('#turn').textContent=`treino ${round}`;setup();status.textContent=msg;flick.disabled=false;flick.textContent='SEGURE PARA CARREGAR';return}if(mode.value==='duel'){player++;if(player>playerCount){player=1;round++}if(round>5){status.textContent=`Duelo final: ${playerNames.map((name,i)=>`${name} ${playerScores[i]}`).join(' · ')}`;flick.textContent='DUELO FINALIZADO';return}$('#turn').textContent=`${round} de 5`;setup();status.textContent=msg+` Vez de ${playerNames[player-1]}.`;flick.disabled=false;flick.textContent='SEGURE PARA CARREGAR';return}if(round++===5){status.textContent=`${msg} Final: ${score} pontos!`;flick.textContent='PARTIDA FINALIZADA';return}$('#turn').textContent=`${round} de 5`;setup();status.textContent=msg+' As faixas mudaram de lugar.';flick.disabled=false;flick.textContent='SEGURE PARA CARREGAR'}function reset(){readPlayers();floorPool=['wood','glass','rubber'].sort(()=>Math.random()-.5).slice(0,2);hardIndex=0;precision.className='';precision.textContent='A precisão do retorno aparecerá aqui.';score=0;round=1;player=1;playerScores=[0,0];streak=0;$('#score').textContent=0;$('#turn').textContent=mode.value==='duel'?'1 de 5 · J1':mode.value==='training'?'treino 1':'1 de 5';flick.disabled=false;flick.textContent='SEGURE PARA CARREGAR';setup();status.textContent='Observe onde está o 100 e dê o peteleco.'}soundToggle.onclick=()=>{soundOn=!soundOn;soundToggle.setAttribute('aria-pressed',soundOn);soundToggle.textContent=soundOn?'🔊 Som: ligado':'🔇 Som: desligado'};difficulty.onchange=reset;floor.onchange=()=>{difficulty.value='custom';reset();};boost.oninput=()=>{if(floor.value==='rubber')status.textContent=`Impulso extra: ${boost.value}%`;};playerCountEl.onchange=()=>{renderPlayers();};renderPlayers();mode.onchange=reset;flick.onpointerdown=down;window.onpointerup=up;$('#reset').onclick=reset;setup();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="rooms.js"></script></body></html>
